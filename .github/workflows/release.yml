name: Release

on:
  push:
    tags:
      - "v*"

# Prevent two releases from running at the same time if tags are pushed consecutively
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, Publish & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release
      id-token: write   # npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # tree-sitter parsers need native build tools
      - name: Install native build tools
        run: sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build --workspaces --if-present

      # Compute publish order via topological sort (dependencies before dependents)
      - name: Compute publish order
        id: topo
        run: |
          node << 'EOF'
          const fs   = require("fs")
          const path = require("path")

          const SCOPE = "@kidkender/"

          // Collect all @kidkender/ packages
          const dirs = [
            ...fs.readdirSync("packages").map(d => `packages/${d}`),
            "apps/cli",
          ]

          const pkgs = []
          for (const dir of dirs) {
            const pkgPath = path.join(dir, "package.json")
            if (!fs.existsSync(pkgPath)) continue
            const p = JSON.parse(fs.readFileSync(pkgPath, "utf-8"))
            if (!p.name.startsWith(SCOPE)) continue
            const allDeps = { ...p.dependencies, ...p.devDependencies, ...p.peerDependencies }
            const internalDeps = Object.keys(allDeps).filter(k => k.startsWith(SCOPE))
            pkgs.push({ name: p.name, dir, deps: internalDeps })
          }

          // Kahn's algorithm — topological sort
          const nameToIdx = Object.fromEntries(pkgs.map((p, i) => [p.name, i]))
          const inDegree  = new Array(pkgs.length).fill(0)
          const adj       = pkgs.map(() => [])

          for (const [i, pkg] of pkgs.entries()) {
            for (const dep of pkg.deps) {
              if (nameToIdx[dep] !== undefined) {
                adj[nameToIdx[dep]].push(i)
                inDegree[i]++
              }
            }
          }

          const queue  = pkgs.map((_, i) => i).filter(i => inDegree[i] === 0)
          const sorted = []
          while (queue.length) {
            const i = queue.shift()
            sorted.push(pkgs[i].dir)
            for (const j of adj[i]) {
              if (--inDegree[j] === 0) queue.push(j)
            }
          }

          if (sorted.length !== pkgs.length) {
            console.error("Circular dependency detected!")
            process.exit(1)
          }

          console.log("Publish order:")
          sorted.forEach((d, i) => console.log(`  ${i + 1}. ${d}`))

          // Write output for the next step to use (newline-separated → base64 to avoid multiline issues)
          const encoded = Buffer.from(sorted.join("\n")).toString("base64")
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `order=${encoded}\n`)
          EOF

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PUBLISHED=()

          # Decode topological order from the previous step
          ORDER=$(echo "${{ steps.topo.outputs.order }}" | base64 -d)

          while IFS= read -r dir; do
            pkg_json="$dir/package.json"
            [ -f "$pkg_json" ] || continue

            name=$(node -p "require('./$pkg_json').name")
            local_ver=$(node -p "require('./$pkg_json').version")

            # Get the current version on npm (0.0.0 if never published)
            remote_ver=$(npm view "$name" version 2>/dev/null || echo "0.0.0")

            if [ "$local_ver" = "$remote_ver" ]; then
              echo "SKIP (no change): $name@$local_ver"
              continue
            fi

            echo "PUBLISH: $name  $remote_ver → $local_ver"
            (cd "$dir" && npm publish --provenance --access public)
            PUBLISHED+=("$name@$local_ver")

          done <<< "$ORDER"

          # Write the list of published packages for the Release creation step
          if [ ${#PUBLISHED[@]} -gt 0 ]; then
            JOINED=$(IFS=', '; echo "${PUBLISHED[*]}")
          else
            JOINED="(no packages published)"
          fi
          echo "PUBLISHED_LIST=$JOINED" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.5.0
          VERSION="${TAG#v}"                # e.g. 0.5.0

          # Extract the matching section from CHANGELOG.md
          # Expect format: ## [0.5.0] - 2026-07-01
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md | sed '/^[[:space:]]*$/d')
          fi

          if [ -z "$NOTES" ]; then
            NOTES="_No changelog entry found for $VERSION. See commit history._"
          fi

          BODY="$NOTES

          ---
          **Packages published:** $PUBLISHED_LIST"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY"
