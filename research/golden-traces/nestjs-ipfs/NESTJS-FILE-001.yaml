id: NESTJS-FILE-001
entrypoint: "POST /files/copy-file"
framework: nestjs
source_project: IPFS-api
adapter_version: "0.3.0"

retrieval:
  query: "Who can copy a file, and is the copy request validated before processing?"

nodes:
  - id: file_auth_gate
    type: ir:auth_gate
    symbol: JwtAuthGuard
    retrieval:
      relevance: HIGH
      compressible: false

  - id: file_controller_copy
    type: ir:business_handler
    symbol: FileController::copyFile
    file: src/files/file.controller.ts
    retrieval:
      relevance: HIGH
      compressible: false

  - id: transfer_dto
    type: ir:validation_gate
    symbol: TransferIpfsFileDto
    retrieval:
      relevance: HIGH
      compressible: false

edges:
  - from: file_auth_gate
    to: file_controller_copy
    relation: next_middleware

  - from: file_controller_copy
    to: transfer_dto
    relation: validates

annotations:
  - type: security_note
    nodes: [file_controller_copy]
    description: >
      POST /files/copy-file is protected by JwtAuthGuard applied at class level.
      TransferIpfsFileDto is validated via global ValidationPipe.
      Both auth and validation are in place for this endpoint.
