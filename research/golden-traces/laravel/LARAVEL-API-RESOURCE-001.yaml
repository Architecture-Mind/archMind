id: LARAVEL-API-RESOURCE-001
entrypoint: "GET /v1/invoices/{id}"
framework: laravel
source_project: crater
adapter_version: "0.1.0"

retrieval:
  query: "What fields does the invoice detail endpoint expose? Are any sensitive fields included in the response?"

nodes:
  - id: sanctum
    type: ir:auth_gate
    symbol: auth:sanctum
    retrieval:
      relevance: MEDIUM
      compressible: true

  - id: company_mw
    type: ir:auth_gate
    symbol: company
    retrieval:
      relevance: LOW
      compressible: true

  - id: bouncer_mw
    type: ir:auth_gate
    symbol: bouncer
    retrieval:
      relevance: LOW
      compressible: true

  - id: invoices_controller_show
    type: ir:business_handler
    symbol: InvoicesController::show
    file: app/Http/Controllers/V1/Admin/Invoice/InvoicesController.php
    retrieval:
      relevance: HIGH
      compressible: false

  - id: invoice_resource
    type: ir:api_resource
    symbol: InvoiceResource::toArray
    file: app/Http/Resources/InvoiceResource.php
    retrieval:
      relevance: HIGH
      compressible: false
    detail:
      fields:
        - id
        - invoice_date
        - due_date
        - invoice_number
        - reference_number
        - status
        - paid_status
        - notes
        - discount
        - sub_total
        - total
        - tax
        - due_amount
        - unique_hash
        - invoice_pdf_url
        - customer_id
        - creator_id
        - items
        - customer
        - creator
        - taxes
        - company
        - currency
      sensitiveFields:
        - unique_hash
      isCollection: false

edges:
  - from: invoices_controller_show
    to: invoice_resource
    relation: ir:returns

expected_findings:
  - type: sensitive_field_exposed
    required_nodes: [invoice_resource]
    notes: >
      unique_hash is a PDF access token used in unauthenticated URL
      /invoices/pdf/{invoice:unique_hash}. Exposing it in the API response
      grants any caller with a valid session unauthenticated PDF access.
      Detected by _hash suffix pattern in SENSITIVE_PATTERNS.

annotations:
  - type: data_exposure
    nodes: [invoice_resource]
    description: >
      unique_hash functions as an access token for unauthenticated PDF download
      routes (/invoices/pdf/{invoice:unique_hash}). invoice_pdf_url exposes a
      pre-signed URL. unique_hash is caught by the _hash suffix pattern added
      to SENSITIVE_PATTERNS in Phase 21.
